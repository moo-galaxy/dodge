<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Images SRT</title>
    <link rel="stylesheet" href="nav.css">
    <script src="nav_all.js"></script>
    <style>
        /* تنسيق عام */
        * {
            padding: 0;
            margin: 0;
            font-style: italic;

        }

        body {
            background-color: #f9f9f9;
        }

        /* تنسيق معرض الصور */
        .gallery {
            column-count: 4;
            /* عدد الأعمدة */
            column-gap: 15px;
            /* المسافة بين الأعمدة */
            padding: 20px;
            margin-top: 60px;
        }

        /* تنسيق كل صورة */
        .image {
            display: inline-block;
            /* مهم للتوافق مع column layout */
            margin-bottom: 15px;
            overflow: hidden;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }

        .image img {
            width: 100%;
            height: auto;
            display: block;
            cursor: pointer;
            /* لتوضيح أن الصورة قابلة للنقر */
        }

        /* تأثير عند تمرير الماوس */
        .image:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
        }

        /* تنسيق النافذة الكاملة */
        .image-overlay {
            display: none;
            /* مخفي بشكل افتراضي */
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.9);
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .image-overlay img {
            max-width: 90%;
            max-height: 90%;
        }

        .image-overlay .close-btn {
            position: absolute;
            top: 20px;
            right: 30px;
            font-size: 2rem;
            color: white;
            cursor: pointer;
            background: none;
            border: none;
            outline: none;
        }

        .image-overlay .nav-btn {
            position: absolute;
            top: 50%;
            font-size: 2rem;
            color: white;
            background: none;
            border: none;
            cursor: pointer;
            transform: translateY(-50%);
        }

        .image-overlay .prev-btn {
            left: 20px;
        }

        .image-overlay .next-btn {
            right: 20px;
        }
    </style>

</head>

<body>
    <div id="navbar-container"></div>

    <div class="gallery">
        <div class="image"><img src="images/1.avif" loading="lazy"></div>
        <div class="image"><img src="images/2.avif" loading="lazy"></div>
        <div class="image"><img src="images/3.webp" loading="lazy"></div>
        <div class="image"><img src="images/4.avif" loading="lazy"></div>
        <div class="image"><img src="images/5.avif" loading="lazy"></div>
        <div class="image"><img src="images/6.avif" loading="lazy"></div>
        <div class="image"><img src="images/a.jpg" loading="lazy"></div>
        <div class="image"><img src="images/b.jpg" loading="lazy"></div>
        <div class="image"><img src="images/c.jpg" loading="lazy"></div>
        <div class="image"><img src="images/d.jpg" loading="lazy"></div>
        <div class="image"><img src="images/e.jpg" loading="lazy"></div>
        <div class="image"><img src="images/f.jpg" loading="lazy"></div>
        <div class="image"><img src="images/g.jpg" loading="lazy"></div>
        <div class="image"><img src="images/h.jpg" loading="lazy"></div>
        <div class="image"><img src="images/i.jpg" loading="lazy"></div>
        <div class="image"><img src="images/j.jpg" loading="lazy"></div>
        <div class="image"><img src="images/k.jpg" loading="lazy"></div>
        <div class="image"><img src="images/l.jpg" loading="lazy"></div>
        <div class="image"><img src="images/logo.webp" loading="lazy"></div>
        <div class="image"><img src="images/m.jpg" loading="lazy"></div>
        <div class="image"><img src="images/n.jpg" loading="lazy"></div>
        <div class="image"><img src="images/o.jpg" loading="lazy"></div>
        <div class="image"><img src="images/p.jpg" loading="lazy"></div>
        <div class="image"><img src="images/q.jpg" loading="lazy"></div>
        <div class="image"><img src="images/r.jpg" loading="lazy"></div>
        <div class="image"><img src="images/s.jpg" loading="lazy"></div>
        <div class="image"><img src="images/SRT.avif" loading="lazy"></div>
        <div class="image"><img src="images/t.jpg" loading="lazy"></div>
        <div class="image"><img src="images/u.jpg" loading="lazy"></div>
        <div class="image"><img src="images/v.jpg" loading="lazy"></div>
        <div class="image"><img src="images/w.jpg" loading="lazy"></div>
        <div class="image"><img src="images/x.jpg" loading="lazy"></div>
        <div class="image"><img src="images/y.jpg" loading="lazy"></div>
        <div class="image"><img src="images/z.jpg" loading="lazy"></div>
        <div class="image"><img src="images/charger b.jpg" loading="lazy"></div>
        <div class="image"><img src="images/charger black.jpg" loading="lazy"></div>
        <div class="image"><img src="images/charger w.jpg" loading="lazy"></div>
        <div class="image"><img src="images/demon b.jpg" loading="lazy"></div>
        <div class="image"><img src="images/demon black.jpg" loading="lazy"></div>
        <div class="image"><img src="images/demon r.jpg" loading="lazy"></div>
        <div class="image"><img src="images/demon w.jpg" loading="lazy"></div>
        <div class="image"><img src="images/Durango b.jpg" loading="lazy"></div>
        <div class="image"><img src="images/Durango post.jpg" loading="lazy"></div>
        <div class="image"><img src="images/Durango r.jpg" loading="lazy"></div>
        <div class="image"><img src="images/Durango w.jpg" loading="lazy"></div>
        <!-- <div class="image"><img src="" loading="lazy"></div> -->

        <div class="image-overlay" id="imageOverlay">
            <button class="close-btn" id="closeOverlay">&times;</button>
            <button class="nav-btn prev-btn" id="prevImage">&#10094;</button>
            <img id="fullImage" src="" loading="lazyFull Image">
            <button class="nav-btn next-btn" id="nextImage">&#10095;</button>
        </div>

        <script>
            // عناصر HTML
            const overlay = document.getElementById("imageOverlay");
            const fullImage = document.getElementById("fullImage");
            const closeOverlay = document.getElementById("closeOverlay");
            const prevImage = document.getElementById("prevImage");
            const nextImage = document.getElementById("nextImage");

            // جمع الصور في مصفوفة
            const images = Array.from(document.querySelectorAll(".image img"));
            let currentIndex = 0;

            // عرض الصورة في النافذة
            const showImage = (index) => {
                currentIndex = index;
                fullImage.src = images[currentIndex].src;
                overlay.style.display = "flex";
            };

            // الانتقال للصورة التالية
            const next = () => {
                currentIndex = (currentIndex + 1) % images.length; // الانتقال دائريًا
                showImage(currentIndex);
            };

            // العودة للصورة السابقة
            const prev = () => {
                currentIndex = (currentIndex - 1 + images.length) % images.length; // الانتقال دائريًا
                showImage(currentIndex);
            };

            // إضافة الأحداث
            images.forEach((image, index) => {
                image.addEventListener("click", () => showImage(index));
            });

            closeOverlay.addEventListener("click", () => {
                overlay.style.display = "none";
            });

            nextImage.addEventListener("click", next);
            prevImage.addEventListener("click", prev);

            // التنقل باستخدام لوحة المفاتيح
            document.addEventListener("keydown", (event) => {
                if (overlay.style.display === "flex") {
                    if (event.key === "ArrowRight") next();
                    if (event.key === "ArrowLeft") prev();
                    if (event.key === "Escape") overlay.style.display = "none";
                }
            });
        </script>
</body>

</html>
